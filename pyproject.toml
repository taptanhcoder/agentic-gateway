[project]
name = "agentic-gateway"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi", "uvicorn", "SQLAlchemy>=2,<3", "psycopg[binary]>=3,<4", "alembic>=1.13,<2"]

[dependency-groups]
dev = ["pytest", "httpx"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
