name: agentic-gateway

x-app: &app
  image: ${GATEWAY_IMAGE:-agentic-gateway:dev}
  build:
    context: .
    target: runtime
  environment:
    DB_HOST: db
    DB_PORT: "5432"
    POSTGRES_DB: ${POSTGRES_DB:-agentic_gateway}
    POSTGRES_USER: ${POSTGRES_USER:-gateway}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    OPERATOR_API_KEY: ${OPERATOR_API_KEY:-}
    SILICONFLOW_CN_CATALOG_API_KEY: ${SILICONFLOW_CN_CATALOG_API_KEY:-}
    SCHEDULER_POLL_SECONDS: ${SCHEDULER_POLL_SECONDS:-2}
    NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
    QUALIFICATION_LIVE_MAX_PROBES: ${QUALIFICATION_LIVE_MAX_PROBES:-0}
    QUALIFICATION_LIVE_ACCOUNT_ID: ${QUALIFICATION_LIVE_ACCOUNT_ID:-}
    QUALIFICATION_LIVE_ACK_ACCOUNT_TERMS: ${QUALIFICATION_LIVE_ACK_ACCOUNT_TERMS:-0}

services:
  agentic-gateway-portal:
    image: agentic-gateway-portal:dev
    build:
      context: ./frontend
    environment:
      GATEWAY_API_URL: http://agentic-gateway-api:8000
      OPERATOR_API_KEY: ${OPERATOR_API_KEY:-}
      PORTAL_COOKIE_SECURE: ${PORTAL_COOKIE_SECURE:-0}
    ports:
      - "127.0.0.1:${PORTAL_PORT:-3000}:3000"
    depends_on:
      agentic-gateway-api:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/portal-api/session').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentic_gateway}
      POSTGRES_USER: ${POSTGRES_USER:-gateway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  migrate:
    <<: *app
    command: ["sh", "-c", "alembic -c /app/alembic.ini upgrade head && python -m agentic_gateway.catalog.seed"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  agentic-gateway-api:
    <<: *app
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 10s

  agentic-gateway-worker:
    <<: *app
    command: ["python", "-m", "agentic_gateway.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 10s

  agentic-gateway-scheduler:
    <<: *app
    command: ["python", "-m", "agentic_gateway.scheduler"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 10s

volumes:
  postgres_data:
