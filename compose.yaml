x-runtime: &runtime
  build: .
  image: agentic-gateway:local
  environment:
    DATABASE_URL: postgresql+psycopg://gateway:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db/gateway

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: gateway
      POSTGRES_DB: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "gateway", "-d", "gateway"]
      interval: 2s
      timeout: 2s
      retries: 30
  migrate:
    <<: *runtime
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
  agentic-gateway-api:
    <<: *runtime
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8000}:8000"
  agentic-gateway-worker:
    <<: *runtime
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "agentic_gateway.worker"]
volumes:
  postgres-data:
